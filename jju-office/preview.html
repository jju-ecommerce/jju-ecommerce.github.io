<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쭈대표 AI 오피스 · 모바일 미리보기</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 18px;
    padding: 24px 16px;
    background: radial-gradient(900px 500px at 50% 0%, #FFF8EC 0%, #F1E5D2 45%, #E4D5BC 100%);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: #6B5B4A;
  }
  .wrap { display: grid; gap: 14px; justify-items: center; }
  .phone {
    width: 410px;
    height: 864px;
    padding: 10px;
    border-radius: 46px;
    background: linear-gradient(160deg, #2A2018, #14100C);
    box-shadow: 0 30px 70px rgba(70, 45, 20, .35), inset 0 0 0 1px rgba(255, 245, 225, .1);
  }
  .screen {
    width: 390px;
    height: 844px;
    border-radius: 38px;
    overflow: hidden;
    background: #FBF6EE;
  }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
  .caption { font-size: 12.5px; letter-spacing: .2px; }
  .caption b { color: #8A5A2B; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="phone">
      <div class="screen">
        <iframe src="./index.html?view=office" title="쭈대표 AI 오피스 모바일 미리보기"></iframe>
      </div>
    </div>
    <p class="caption">모바일 미리보기 · <b>390 × 844</b> · 실제 앱은 <a href="./">jju-ecommerce.github.io/jju-office/</a></p>
  </div>
</body>
</html>
